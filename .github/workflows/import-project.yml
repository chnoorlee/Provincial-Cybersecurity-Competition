name: Import project bundle

on:
  push:
    branches:
      - main
    paths:
      - project-upload.zip

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand project bundle
        run: |
          unzip -o project-upload.zip
          rm project-upload.zip
          rm .github/workflows/import-project.yml

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add XunAn website security inspection agent"
          git push
